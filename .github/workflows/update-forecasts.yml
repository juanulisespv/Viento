name: Actualizar Predicciones de Viento Estáticas

on:
  schedule:
    # Se ejecuta 4 veces al día (01:15, 07:15, 13:15, 19:15 UTC)
    - cron: '15 1,7,13,19 * * *'
  workflow_dispatch: # Ejecución manual con 1 clic desde GitHub Actions

permissions:
  contents: write

jobs:
  update-forecasts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar predicciones de Open-Meteo
        run: node scripts/fetch-forecasts.js

      - name: Hacer commit y push de los archivos JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios en los pronósticos."
          else
            git commit -m "chore: actualización automática de predicciones estáticas [skip ci]"
            git push
          fi
